aid: cognito
name: Cognito
description: >-
  Cognito (cognitohq.com, operated by BlockScore, Inc.) is an identity
  verification, KYC, and AML compliance API provider that was backed by Y
  Combinator and Battery Ventures and acquired by Plaid in 2020. Its API turns a
  phone number, name, or ID document into a verified identity in under a minute,
  covering 209 countries and thousands of document types. Three developer
  products sit on one REST API: Identity (phone-first, frictionless
  verification), Flow (an all-in-one hosted / embeddable verification experience
  integrated in minutes with document and selfie checks), and Screening
  (watchlist, sanctions, and politically-exposed-person AML screening with daily
  re-scans across 20+ lists). The API is JSON:API (application/vnd.api+json),
  date-versioned via a Cognito-Version header, and authenticated with HTTP
  request signatures (HMAC-SHA256 over a digest of the body). It ships a sandbox
  host, signed webhooks, and client SDKs for seven languages.
